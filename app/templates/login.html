{% extends "auth_base.html" %}
{% block title %}Entrar{% endblock %}
{% block heading %}Hola de nuevo{% endblock %}
{% block sub %}Entra para seguir con lo que tienes a medias.{% endblock %}
{% block form %}
<form method="post" action="/login" class="auth-form">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="login-username">Usuario</label><input class="input" type="text" id="login-username" name="username" autocomplete="username" autocapitalize="none" autofocus required></div>
  <div class="field"><label for="login-password">Contraseña</label><input class="input" type="password" id="login-password" name="password" autocomplete="current-password" required></div>
  <button class="btn lg">Entrar</button>
</form>
{% endblock %}
{% block foot %}¿Te han invitado? <a class="link" href="/activar">Activa tu cuenta</a>{% endblock %}
