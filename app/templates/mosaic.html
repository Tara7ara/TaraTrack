{% extends "base.html" %}
{% block content %}
<h1>Mosaico</h1>
<div class="mosaic-grid">
    {% for p in posters %}
    <a href="/titulo/{{ p.tmdb_id }}/{{ p.type }}" title="Ver ficha" style="position:relative">
        {% if p.custom_poster %}<span class="custom-poster-badge" title="Portada propia">★</span>{% endif %}
        {# Casillas de ~90px: la miniatura de 240px basta también en pantallas 3x. #}
        <img src="{{ p.poster_path|poster_size('w185') }}" alt="" loading="lazy" decoding="async">
    </a>
    {% endfor %}
</div>
{% endblock %}
