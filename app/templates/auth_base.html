<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TaraTrack — {% block title %}Entrar{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
    <link rel="apple-touch-icon" href="{{ touch_icon_data_uri }}">
    <meta name="theme-color" content="#0f0f0f">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="TaraTrack">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v={{ static_v }}">
</head>
{% from "partials/ui.html" import logo %}
<body class="auth">
  <main class="auth-box">
    <div class="auth-brand">{{ logo(40) }}<span>TaraTrack</span></div>
    <div class="auth-card">
      <header class="auth-head"><h1>{% block heading %}{% endblock %}</h1><p>{% block sub %}{% endblock %}</p></header>
      {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
      {% block form %}{% endblock %}
    </div>
    <p class="auth-foot">{% block foot %}{% endblock %}</p>
  </main>
</body>
</html>
