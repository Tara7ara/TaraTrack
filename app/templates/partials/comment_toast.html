{# Aviso "¿comentas?" tras marcar un episodio desde Continuar viendo o Pendientes.
   Abre el comentario privado (?apunte=), no el debate (?comentar=). Desaparece a los
   6 s o se cierra a mano. #}
<div id="comment-toast" hx-swap-oob="innerHTML">
    <div class="comment-toast" data-autoclose>
        <span>T{{ season_number }}E{{ episode_number }} marcado</span>
        <a href="/titulo/{{ tmdb_id }}/{{ type }}?apunte={{ episode_id }}#ep-{{ episode_id }}">Comentar</a>
        <button type="button" onclick="this.closest('.comment-toast').remove()" aria-label="Cerrar">×</button>
    </div>
    <script>
        (function () {
            var t = document.currentScript.previousElementSibling;
            setTimeout(function () { if (t && t.parentNode) t.remove(); }, 6000);
        })();
    </script>
</div>
