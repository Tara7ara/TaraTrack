{% if not results and query %}<p class="hint">{{ 'MyAnimeList no responde ahora mismo, prueba en un rato.' if api_down else 'Nada con «' ~ query ~ '».' }}</p>{% endif %}
{% for r in results %}
<div class="char">
  {% if r.image_url %}<img src="{{ r.image_url }}" alt="{{ r.name }}" loading="lazy">{% else %}<span class="ph"></span>{% endif %}
  <span class="nm">{{ r.name }}</span>{% if r.media %}<span class="sub">{{ r.media|join(", ") }}</span>{% endif %}
  <form method="post" action="/titulo/{{ tmdb_id }}/{{ type }}/personajes/anadir">
    <input type="hidden" name="char_id" value="{{ r.id }}"><input type="hidden" name="name" value="{{ r.name }}"><input type="hidden" name="image_url" value="{{ r.image_url or '' }}">
    <button class="btn sm ghost">Añadir</button></form>
</div>
{% endfor %}
