{% from "partials/ui.html" import ic %}
<div class="actions">
{% if state == "watched" %}
    <button class="btn quiet" disabled>{{ ic('check', 'sm') }}<span class="lbl">Vista</span></button>
    <a class="btn" href="/marcar-vista/{{ tmdb_id }}/{{ type }}?volver={{ volver or 'puntuar' }}">Puntuar</a>
{% elif state == "pending" %}
    <button class="btn quiet act-pend" title="En pendientes · pulsa para quitar"
            hx-get="/pendiente/{{ tmdb_id }}/{{ type }}/confirmar" hx-target="closest .actions" hx-swap="outerHTML">{{ ic('check', 'sm') }}<span class="lbl">En pendientes</span></button>
    <button class="btn" hx-post="/vista/{{ tmdb_id }}/{{ type }}" hx-target="closest .actions" hx-swap="outerHTML"><span class="lbl-long">Marcar vista</span><span class="lbl-short">Vista</span></button>
{% elif state == "pending_confirm" %}
    <button class="btn danger-solid" title="Sí, quitarlo de pendientes"
            hx-post="/pendiente/{{ tmdb_id }}/{{ type }}" hx-target="closest .actions" hx-swap="outerHTML">¿Quitar? Sí</button>
    <button class="btn quiet" title="No, dejarlo"
            hx-get="/pendiente/{{ tmdb_id }}/{{ type }}/estado" hx-target="closest .actions" hx-swap="outerHTML">No</button>
{% else %}
    <button class="btn ghost act-add" title="Añadir a pendientes" hx-post="/pendiente/{{ tmdb_id }}/{{ type }}" hx-target="closest .actions" hx-swap="outerHTML">{{ ic('plus', 'sm') }}<span class="lbl">Pendientes</span></button>
    <button class="btn" hx-post="/vista/{{ tmdb_id }}/{{ type }}" hx-target="closest .actions" hx-swap="outerHTML"><span class="lbl-long">Marcar vista</span><span class="lbl-short">Vista</span></button>
{% endif %}
</div>
