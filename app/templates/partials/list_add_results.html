{% if not results and query %}<p class="hint">Sin resultados para «{{ query }}».</p>{% endif %}
{% for r in results %}
<div class="lrow"><div class="lrow-in" style="grid-template-columns:44px 1fr auto">
  <img src="{{ r.poster_url or '' }}" alt="" loading="lazy" style="width:44px;aspect-ratio:2/3;object-fit:cover;border-radius:5px" onerror="this.remove()">
  <div class="info"><a href="/titulo/{{ r.tmdb_id }}/{{ r.type }}">{{ r.title }}</a><div class="m">{{ r.year or "—" }} · {{ "Serie" if r.type == "show" else "Película" }}</div></div>
  {% if r.tmdb_id in en_lista %}<button class="btn sm quiet" disabled>En la lista</button>
  {% else %}<form method="post" action="/lista/{{ list_id }}/anadir/{{ r.tmdb_id }}/{{ r.type }}"><button class="btn sm">Añadir</button></form>{% endif %}
</div></div>
{% endfor %}
