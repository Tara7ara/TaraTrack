[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Solo reglas que casi siempre señalan un error (imports y variables sin usar,
# nombres indefinidos, sintaxis, orden de imports). Nada de reglas de estilo: el
# "except Exception" ancho alrededor de TMDB/AniList es deliberado.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # linea larga - hay comentarios explicativos deliberadamente largos en este proyecto
]
